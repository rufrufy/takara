<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/Takara-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFDF5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Takara" />
    <link rel="apple-touch-icon" href="/Takara.png" />
    <title>Takara — Keuangan Rumah Tangga</title>
    <script>
      if ('serviceWorker' in navigator) {
        var isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          }).catch(function() {});
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            }).catch(function() {});
          }
        } else {
          window.addEventListener('load', function() {
            var hadController = !!navigator.serviceWorker.controller;
            var swReloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              if (hadController && !swReloading) {
                swReloading = true;
                window.location.reload();
              }
            });
            navigator.serviceWorker
              .register('/sw.js', { updateViaCache: 'none' })
              .then(function(reg) {
                if (reg.waiting) {
                  reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                reg.addEventListener('updatefound', function() {
                  var installing = reg.installing;
                  if (!installing) return;
                  installing.addEventListener('statechange', function() {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      installing.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                });
              })
              .catch(function() {});
          });
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
